name: Publish npm Package

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 1.0.2, or semver bump: patch, minor, major)'
        required: true
        default: 'patch'
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Publish to npm (Trusted Publishing)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Ensure latest npm (for OIDC Trusted Publishing)
        run: npm install -g npm@latest

      - name: Set and check version
        id: version_check
        run: |
          # Apply requested version or semver bump (e.g., 1.0.2 or patch/minor/major)
          TARGET_VERSION=$(npm version ${{ inputs.version }} --no-git-tag-version --allow-same-version)
          # Strip leading 'v' if present
          TARGET_VERSION=${TARGET_VERSION#v}
          echo "Target version: $TARGET_VERSION"

          # Check if package version already exists on npm registry
          PKG_NAME=$(node -p "require('./package.json').name")
          EXISTS=$(npm view "${PKG_NAME}@${TARGET_VERSION}" version 2>/dev/null || echo "")

          if [ -n "$EXISTS" ]; then
            echo "::error::Version ${TARGET_VERSION} of ${PKG_NAME} already exists on npm registry!"
            exit 1
          fi

          echo "Version ${TARGET_VERSION} is available for publishing."
          echo "version=${TARGET_VERSION}" >> $GITHUB_OUTPUT

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build package
        run: npm run build

      - name: Publish to npm with provenance (Trusted Publishing)
        run: npm publish --provenance --access public

      - name: Commit and push version update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --staged --quiet || git commit -m "chore(release): v${{ steps.version_check.outputs.version }}"
          git tag -a "v${{ steps.version_check.outputs.version }}" -m "Release v${{ steps.version_check.outputs.version }}"
          git push origin HEAD:${{ github.ref_name }} --tags
